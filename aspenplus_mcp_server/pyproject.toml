[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspenplus-mcp"
version = "0.1.0"
description = "MCP server for Aspen Plus process simulation integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Daniel B"}
]
dependencies = [
    "mcp>=1.0.0",
    "pywin32>=306; platform_system=='Windows'",
    "numpy>=1.20.0",  # Required by vendored aspen_interface.py
]

# Note: aspen_interface.py is vendored from:
# https://github.com/YouMayCallMeJesus/AspenPlus-Python-Interface

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
